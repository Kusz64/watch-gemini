<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gemini Watch</title>
  <style>
    :root { --fs: 22px; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      padding: 32px 11% 90px;
      min-height: 100vh;
    }
    .entry {
      padding: 14px 0;
      border-bottom: 1px solid #222;
      scroll-margin-top: 26px;
    }
    .q {
      font-size: calc(var(--fs) - 3px);
      font-weight: 700;
      color: #8ab4f8;
      margin-bottom: 10px;
      line-height: 1.25;
      text-align: center;
      word-wrap: break-word;
    }
    .a {
      font-size: var(--fs);
      font-weight: 500;
      color: #fff;
      line-height: 1.35;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .src {
      margin-top: 10px;
      font-size: 14px;
      color: #81c995;
      line-height: 1.3;
    }
    .err { color: #ff8a80; }
    .hint {
      font-size: 18px;
      color: #aaa;
      text-align: center;
      margin: 12px 0 16px;
      line-height: 1.3;
    }
    textarea, input[type="text"], input[type="password"] {
      width: 100%;
      padding: 13px;
      border: 2px solid #444;
      border-radius: 18px;
      background: #141416;
      color: #fff;
      font-size: 19px;
      font-family: inherit;
      line-height: 1.3;
      margin: 10px 0;
      outline: none;
    }
    textarea:focus, input:focus { border-color: #1a73e8; }
    button {
      border: none;
      border-radius: 24px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .big-btn {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      background: #1a73e8;
      color: #fff;
      margin-bottom: 12px;
    }
    .big-btn:disabled { background: #333; color: #888; }
    .row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .pill {
      padding: 11px 15px;
      font-size: 16px;
      background: #222;
      color: #eee;
    }
    .pill.on {
      background: #134e3a;
      color: #b7f7d8;
      border: 1px solid #34a853;
    }
    details {
      margin-top: 22px;
      color: #ccc;
      font-size: 15px;
      border-top: 1px solid #222;
      padding-top: 12px;
    }
    summary {
      padding: 10px;
      cursor: pointer;
      text-align: center;
      font-weight: 700;
      color: #aaa;
    }
    .panel {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 12px;
      margin-top: 10px;
    }
    .panel h3 {
      margin: 0 0 8px;
      font-size: 16px;
      color: #8ab4f8;
    }
    .doc-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid #222;
      font-size: 14px;
      word-break: break-word;
    }
    .del-btn {
      background: #5c1919;
      color: #ffb4ab;
      padding: 6px 10px;
      font-size: 13px;
      flex-shrink: 0;
    }
    .status {
      font-size: 14px;
      color: #8ab4f8;
      margin: 8px 0;
      text-align: center;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- Pantalla de API Key -->
  <div id="setupView" class="hidden">
    <div class="hint">Pega tu API Key de Google AI Studio</div>
    <input id="keyInput" type="password" placeholder="AIza...">
    <button id="saveKeyBtn" class="big-btn">Guardar clave</button>
  </div>

  <!-- Pantalla principal -->
  <div id="chatView" class="hidden">
    <div id="chat">
      <div class="hint">Toca abajo para escribir tu pregunta</div>
    </div>

    <textarea
      id="promptInput"
      rows="3"
      placeholder="Toca aquí para escribir..."
      autocorrect="on"
      autocapitalize="sentences"
      spellcheck="true"
    ></textarea>

    <button id="sendBtn" class="big-btn">Enviar</button>

    <div class="row">
      <button id="sourcesBtn" class="pill">📚 Fuentes: OFF</button>
      <button id="modeBtn" class="pill">⚡ Rápido</button>
    </div>

    <div class="row">
      <button id="clearBtn" class="pill">Limpiar</button>
      <button id="fontDown" class="pill">A-</button>
      <button id="fontUp" class="pill">A+</button>
    </div>

    <details id="optionsPanel">
      <summary>⚙ Opciones y Fuentes</summary>

      <div class="panel">
        <h3>📚 Subir archivo (PC / Celular)</h3>
        <input id="fileInput" type="file" accept=".md,.txt,.pdf,.doc,.docx,.ppt,.pptx,.csv" style="width:100%;color:#ccc;margin:6px 0;">
        <button id="uploadFileBtn" class="big-btn" style="padding:12px;font-size:16px;margin:8px 0 0;">Subir archivo</button>
      </div>

      <div class="panel">
        <h3>📝 Pegar texto / transcripción</h3>
        <input id="noteTitle" type="text" placeholder="Nombre (ej: clase1.md)" style="font-size:15px;padding:10px;">
        <textarea id="noteBody" rows="4" placeholder="Pega aquí apuntes, chat o transcripción de audio..." style="font-size:15px;padding:10px;"></textarea>
        <button id="uploadTextBtn" class="big-btn" style="padding:12px;font-size:16px;margin:4px 0 0;">Guardar texto como fuente</button>
      </div>

      <div class="panel">
        <h3>📂 Fuentes guardadas</h3>
        <div id="sourceStatus" class="status">Cargando...</div>
        <div id="docList"></div>
        <div class="row">
          <button id="refreshDocsBtn" class="pill" style="font-size:14px;">Actualizar lista</button>
        </div>
      </div>

      <div class="row" style="margin-top:14px;">
        <button id="syncBtn" class="pill">Pasar al reloj</button>
        <button id="resetKeyBtn" class="pill">Cambiar clave</button>
      </div>
    </details>
  </div>

  <script>
    const API_BASE = "https://generativelanguage.googleapis.com/v1beta";
    const UPLOAD_BASE = "https://generativelanguage.googleapis.com/upload/v1beta";
    const STORE_DISPLAY = "WatchGeminiSources";

    const KEY_STORAGE = "gemini_watch_api_key";
    const SIZE_STORAGE = "gemini_watch_font_size";
    const MODE_STORAGE = "gemini_watch_mode";
    const RAG_STORAGE = "gemini_watch_use_sources";

    let chatHistory = [];
    let isLoading = false;
    let fontSize = parseInt(localStorage.getItem(SIZE_STORAGE) || "22", 10);
    let mode = localStorage.getItem(MODE_STORAGE) || "fast";
    let useSources = localStorage.getItem(RAG_STORAGE) === "1";
    let activeStoreName = null;
    let activeDocs = [];

    const setupView = document.getElementById("setupView");
    const chatView = document.getElementById("chatView");
    const chatEl = document.getElementById("chat");
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");
    const modeBtn = document.getElementById("modeBtn");
    const sourcesBtn = document.getElementById("sourcesBtn");
    const sourceStatus = document.getElementById("sourceStatus");
    const docList = document.getElementById("docList");

    if (location.hash.startsWith("#key=")) {
      const k = decodeURIComponent(location.hash.slice(5)).trim();
      if (k) {
        localStorage.setItem(KEY_STORAGE, k);
        window.history.replaceState(null, "", location.pathname);
      }
    }

    function getKey() { return localStorage.getItem(KEY_STORAGE) || ""; }

    function applyFont() {
      fontSize = Math.max(16, Math.min(32, fontSize));
      document.documentElement.style.setProperty("--fs", fontSize + "px");
      localStorage.setItem(SIZE_STORAGE, String(fontSize));
    }

    function applyMode() {
      modeBtn.textContent = mode === "fast" ? "⚡ Rápido" : "🧠 Pro";
      localStorage.setItem(MODE_STORAGE, mode);
    }

    function updateSourcesBtn() {
      const count = activeDocs.length;
      const active = useSources && count > 0;
      sourcesBtn.classList.toggle("on", active);
      if (count === 0) {
        sourcesBtn.textContent = "📚 Fuentes (0)";
      } else {
        sourcesBtn.textContent = active ? `📚 Fuentes: ON (${count})` : `📚 Fuentes: OFF (${count})`;
      }
      localStorage.setItem(RAG_STORAGE, useSources ? "1" : "0");
    }

    async function apiJson(url, options = {}) {
      const res = await fetch(url, options);
      const raw = await res.text();
      let data = {};
      try { data = raw ? JSON.parse(raw) : {}; } catch {}
      if (!res.ok) throw new Error(data.error?.message || ("HTTP " + res.status));
      return data;
    }

    function getMimeType(fileName, fallback) {
      const ext = (fileName.split(".").pop() || "").toLowerCase();
      const map = {
        md: "text/markdown",
        txt: "text/plain",
        csv: "text/csv",
        pdf: "application/pdf",
        doc: "application/msword",
        docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
        ppt: "application/vnd.ms-powerpoint",
        pptx: "application/vnd.openxmlformats-officedocument.presentationml.presentation"
      };
      return map[ext] || fallback || "text/plain";
    }

    async function loadSources() {
      const apiKey = getKey();
      if (!apiKey) return;
      sourceStatus.textContent = "Sincronizando fuentes...";
      try {
        const storesData = await apiJson(`${API_BASE}/fileSearchStores?key=${encodeURIComponent(apiKey)}`);
        const stores = storesData.fileSearchStores || [];
        const found = stores.find(s => s.displayName === STORE_DISPLAY) || stores[0] || null;
        activeStoreName = found ? found.name : null;

        if (!activeStoreName) {
          activeDocs = [];
          renderDocs();
          sourceStatus.textContent = "Sin fuentes aún. Sube un archivo o pega texto arriba.";
          updateSourcesBtn();
          return;
        }

        const docsData = await apiJson(`${API_BASE}/${activeStoreName}/documents?key=${encodeURIComponent(apiKey)}`);
        activeDocs = docsData.documents || [];
        renderDocs();
        sourceStatus.textContent = activeDocs.length
          ? `${activeDocs.length} fuente(s) lista(s)`
          : "Carpeta vacía. Sube tu primera fuente.";
        updateSourcesBtn();
      } catch (err) {
        sourceStatus.textContent = "Error al cargar fuentes: " + err.message;
      }
    }

    async function ensureStore() {
      if (activeStoreName) return activeStoreName;
      const apiKey = getKey();
      const created = await apiJson(`${API_BASE}/fileSearchStores?key=${encodeURIComponent(apiKey)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ displayName: STORE_DISPLAY })
      });
      activeStoreName = created.name;
      return activeStoreName;
    }

    async function uploadBlobToStore(blob, fileName, mimeType) {
      const apiKey = getKey();
      const storeName = await ensureStore();
      const boundary = "watchgemini" + Date.now();
      const metadata = JSON.stringify({ displayName: fileName, mimeType });

      const bodyBlob = new Blob([
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${metadata}\r\n`,
        `--${boundary}\r\nContent-Type: ${mimeType}\r\n\r\n`,
        blob,
        `\r\n--${boundary}--`
      ]);

      sourceStatus.textContent = `Subiendo "${fileName}"...`;
      let op = await apiJson(
        `${UPLOAD_BASE}/${storeName}:uploadToFileSearchStore?uploadType=multipart&key=${encodeURIComponent(apiKey)}`,
        {
          method: "POST",
          headers: { "Content-Type": `multipart/related; boundary=${boundary}` },
          body: bodyBlob
        }
      );

      let tries = 0;
      while (op && !op.done && op.name && tries < 45) {
        sourceStatus.textContent = `Indexando "${fileName}"...`;
        await new Promise(r => setTimeout(r, 1500));
        op = await apiJson(`${API_BASE}/${op.name}?key=${encodeURIComponent(apiKey)}`);
        tries++;
      }
      if (op && op.error) throw new Error(op.error.message || "Error al indexar");

      useSources = true;
      await loadSources();
      sourceStatus.textContent = `✅ "${fileName}" lista para consultar`;
    }

    async function deleteDoc(docName) {
      if (!confirm("¿Borrar esta fuente?")) return;
      const apiKey = getKey();
      sourceStatus.textContent = "Borrando fuente...";
      try {
        await apiJson(`${API_BASE}/${docName}?force=true&key=${encodeURIComponent(apiKey)}`, {
          method: "DELETE"
        });
        await loadSources();
      } catch (err) {
        sourceStatus.textContent = "Error al borrar: " + err.message;
      }
    }

    function renderDocs() {
      docList.innerHTML = "";
      activeDocs.forEach(doc => {
        const row = document.createElement("div");
        row.className = "doc-item";
        const span = document.createElement("span");
        span.textContent = doc.displayName || doc.name.split("/").pop();
        const del = document.createElement("button");
        del.className = "del-btn";
        del.textContent = "Borrar";
        del.onclick = () => deleteDoc(doc.name);
        row.appendChild(span);
        row.appendChild(del);
        docList.appendChild(row);
      });
    }

    function updateView() {
      const hasKey = !!getKey();
      setupView.classList.toggle("hidden", hasKey);
      chatView.classList.toggle("hidden", !hasKey);
      if (hasKey) loadSources();
    }

    async function sendPrompt() {
      const text = promptInput.value.trim();
      const apiKey = getKey();
      if (!text || !apiKey || isLoading) return;

      isLoading = true;
      sendBtn.disabled = true;
      sendBtn.textContent = "Pensando...";
      promptInput.value = "";

      const hint = chatEl.querySelector(".hint");
      if (hint) hint.remove();

      const entry = document.createElement("div");
      entry.className = "entry";
      const qEl = document.createElement("div");
      qEl.className = "q";
      qEl.textContent = text;
      const aEl = document.createElement("div");
      aEl.className = "a";
      aEl.textContent = "Buscando...";
      entry.appendChild(qEl);
      entry.appendChild(aEl);
      chatEl.appendChild(entry);
      entry.scrollIntoView({ behavior: "smooth", block: "start" });

      chatHistory.push({ role: "user", parts: [{ text }] });

      const modelId = mode === "fast" ? "gemini-3.5-flash-lite" : "gemini-4-hydrogen";
      const thinkLvl = mode === "fast" ? "minimal" : "low";
      const useRag = useSources && !!activeStoreName && activeDocs.length > 0;

      const sysText = useRag
        ? "Responde en español, claro, preciso y en puntos cortos para leer en un reloj. Usa ÚNICAMENTE la información de las fuentes adjuntas en File Search. Si un dato no aparece en las fuentes, responde claramente 'No aparece en tus fuentes' y NO inventes ni completes con conocimiento externo. No uses asteriscos, almohadillas ni tablas."
        : "Responde en español de forma clara, directa y en puntos cortos para leer fácilmente en la pantalla redonda de un reloj. No uses asteriscos, almohadillas ni tablas.";

      const payload = {
        systemInstruction: { parts: [{ text: sysText }] },
        contents: chatHistory,
        generationConfig: { thinkingConfig: { thinkingLevel: thinkLvl } }
      };

      if (useRag) {
        payload.tools = [{ fileSearch: { fileSearchStoreNames: [activeStoreName] } }];
      }

      try {
        const data = await apiJson(
          `${API_BASE}/models/${modelId}:generateContent?key=${encodeURIComponent(apiKey)}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          }
        );

        const cand = data.candidates?.[0] || {};
        const parts = cand.content?.parts || [];
        const reply = parts
          .filter(p => !p.thought && p.text)
          .map(p => p.text)
          .join("\n")
          .replace(/\*\*/g, "")
          .replace(/^#+\s*/gm, "")
          .trim() || "(Sin respuesta)";

        chatHistory.push({ role: "model", parts: [{ text: reply }] });
        aEl.textContent = reply;

        const chunks = cand.groundingMetadata?.groundingChunks || [];
        const cited = [...new Set(
          chunks.map(c => c.retrievedContext?.title).filter(Boolean)
        )];
        if (cited.length) {
          const srcEl = document.createElement("div");
          srcEl.className = "src";
          srcEl.textContent = "Fuentes: " + cited.join(", ");
          entry.appendChild(srcEl);
        }

        entry.scrollIntoView({ behavior: "smooth", block: "start" });
      } catch (err) {
        chatHistory.pop();
        aEl.classList.add("err");
        aEl.textContent = "Error: " + err.message;
      } finally {
        isLoading = false;
        sendBtn.disabled = false;
        sendBtn.textContent = "Enviar";
      }
    }

    document.getElementById("saveKeyBtn").onclick = () => {
      const k = document.getElementById("keyInput").value.trim();
      if (!k) return;
      localStorage.setItem(KEY_STORAGE, k);
      document.getElementById("keyInput").value = "";
      updateView();
    };

    sendBtn.onclick = sendPrompt;

    sourcesBtn.onclick = () => {
      if (activeDocs.length === 0) {
        alert("Aún no tienes fuentes cargadas. Abre '⚙ Opciones y Fuentes' desde tu PC o celular para subir archivos o pegar texto.");
        return;
      }
      useSources = !useSources;
      updateSourcesBtn();
    };

    document.getElementById("uploadFileBtn").onclick = async () => {
      const file = document.getElementById("fileInput").files[0];
      if (!file) { sourceStatus.textContent = "Elige un archivo primero."; return; }
      try {
        await uploadBlobToStore(file, file.name, getMimeType(file.name, file.type));
        document.getElementById("fileInput").value = "";
      } catch (err) {
        sourceStatus.textContent = "Error al subir: " + err.message;
      }
    };

    document.getElementById("uploadTextBtn").onclick = async () => {
      const titleRaw = document.getElementById("noteTitle").value.trim() || ("nota-" + Date.now());
      const body = document.getElementById("noteBody").value.trim();
      if (!body) { sourceStatus.textContent = "Pega algún texto primero."; return; }
      const fileName = /\.(md|txt)$/i.test(titleRaw) ? titleRaw : (titleRaw + ".md");
      try {
        const blob = new Blob([body], { type: "text/markdown;charset=utf-8" });
        await uploadBlobToStore(blob, fileName, "text/markdown");
        document.getElementById("noteTitle").value = "";
        document.getElementById("noteBody").value = "";
      } catch (err) {
        sourceStatus.textContent = "Error al guardar texto: " + err.message;
      }
    };

    document.getElementById("refreshDocsBtn").onclick = loadSources;

    document.getElementById("clearBtn").onclick = () => {
      chatHistory = [];
      chatEl.innerHTML = '<div class="hint">Chat limpio. Toca abajo para escribir</div>';
      window.scrollTo(0, 0);
    };

    modeBtn.onclick = () => {
      mode = mode === "fast" ? "smart" : "fast";
      applyMode();
    };

    document.getElementById("fontDown").onclick = () => { fontSize -= 2; applyFont(); };
    document.getElementById("fontUp").onclick = () => { fontSize += 2; applyFont(); };

    document.getElementById("syncBtn").onclick = () => {
      const k = getKey();
      if (!k) return;
      location.hash = "key=" + encodeURIComponent(k);
      alert("Listo. Guarda esta página en Marcadores de Samsung Internet en tu celular.");
    };

    document.getElementById("resetKeyBtn").onclick = () => {
      if (confirm("¿Borrar la API Key de este dispositivo?")) {
        localStorage.removeItem(KEY_STORAGE);
        updateView();
      }
    };

    applyFont();
    applyMode();
    updateSourcesBtn();
    updateView();
  </script>
</body>
</html>
